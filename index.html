<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国彩票信息公开平台</title>
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
<nav>
    <div class="nav-links">
        <a href="/"><img src="img/favicon.ico" class="logo"></a>
        <a href="/">首页</a>
        <a href="html/ssq.html">双色球</a>
        <a href="html/kl8.html">快乐8</a>
        <a href="html/fc3d.html">福彩3D</a>
        <a href="html/dlt.html">大乐透</a>
        <a href="html/tc7xc.html">七星彩</a>
        <a href="html/pl.html">排列</a>
        <a href="html/qlc.html">七乐彩</a>
    </div>
</nav>

<main>
    <section class="lottery-section" id="latest-results">
        <h2>最新开奖信息</h2>
        <div class="update-time" id="update-time"></div>
        <div id="ssq-latest"></div>
        <div id="kl8-latest"></div>
        <div id="fc3d-latest"></div>
        <div id="dlt-latest"></div>
        <div id="tc7xc-latest"></div>
        <div id="pl-latest"></div>
        <div id="qlc-latest"></div>
    </section>

    <script src="js/lottery_latest.js"></script>
    
    <section class="lottery-section" id="random-numbers">
        <h2>随机号码生成</h2>
        
        <div class="random-games">
            <div class="random-game">
                <div class="title-btn-row">
                    <h3>双色球</h3>
                    <button class="regenerate-btn" onclick="generateSSQNumbers()">再来一组</button>
                </div>
                <div id="ssq-random-result"></div>
            </div>
            
            <div class="random-game">
                <div class="title-btn-row">
                    <h3>快乐8</h3>
                    <button class="regenerate-btn" onclick="generateAllKL8Numbers()">再来一组</button>
                </div>
                <div class="kl8-pyramid">
                    <div class="kl8-row">
                        <span class="kl8-label">选1:</span>
                        <div id="kl8-random-1"></div>
                    </div>
                    <div class="kl8-row">
                        <span class="kl8-label">选2:</span>
                        <div id="kl8-random-2"></div>
                    </div>
                    <div class="kl8-row">
                        <span class="kl8-label">选3:</span>
                        <div id="kl8-random-3"></div>
                    </div>
                    <div class="kl8-row">
                        <span class="kl8-label">选4:</span>
                        <div id="kl8-random-4"></div>
                    </div>
                    <div class="kl8-row">
                        <span class="kl8-label">选5:</span>
                        <div id="kl8-random-5"></div>
                    </div>
                    <div class="kl8-row">
                        <span class="kl8-label">选6:</span>
                        <div id="kl8-random-6"></div>
                    </div>
                    <div class="kl8-row">
                        <span class="kl8-label">选7:</span>
                        <div id="kl8-random-7"></div>
                    </div>
                    <div class="kl8-row">
                        <span class="kl8-label">选8:</span>
                        <div id="kl8-random-8"></div>
                    </div>
                    <div class="kl8-row">
                        <span class="kl8-label">选9:</span>
                        <div id="kl8-random-9"></div>
                    </div>
                    <div class="kl8-row">
                        <span class="kl8-label">选10:</span>
                        <div id="kl8-random-10"></div>
                    </div>
                </div>
            </div>
            
            <div class="random-game">
                <div class="title-btn-row">
                    <h3>福彩3D</h3>
                    <button class="regenerate-btn" onclick="generateFC3DNumbers()">再来一组</button>
                </div>
                <div id="fc3d-random-result"></div>
            </div>
            
            <div class="random-game">
                <div class="title-btn-row">
                    <h3>大乐透</h3>
                    <button class="regenerate-btn" onclick="generateDLTNumbers()">再来一组</button>
                </div>
                <div id="dlt-random-result"></div>
            </div>
            
            <div class="random-game">
                <div class="title-btn-row">
                    <h3>七星彩</h3>
                    <button class="regenerate-btn" onclick="generateTC7XCNumbers()">再来一组</button>
                </div>
                <div id="tc7xc-random-result"></div>
            </div>
            
            <div class="random-game">
                <div class="title-btn-row">
                    <h3>排列</h3>
                    <button class="regenerate-btn" onclick="generatePLNumbers()">再来一组</button>
                </div>
                <div id="pl-random-result"></div>
            </div>
            
            <div class="random-game">
                <div class="title-btn-row">
                    <h3>七乐彩</h3>
                    <button class="regenerate-btn" onclick="generateQLCNumbers()">再来一组</button>
                </div>
                <div id="qlc-random-result"></div>
            </div>
        </div>
    </section>
</main>

<script src="js/random_numbers.js"></script>

</body>
</html>
