<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>七乐彩开奖结果</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
    <div id="nav-container"></div>

<main>
    <h1>七乐彩开奖结果
        <button class="download-btn" id="qlc-download-data">下载原始数据</button>
    </h1>

    <div class="search-and-rows">
        <div class="search-box">
            <input type="text" id="period-search" placeholder="输入期号查询">
            <button id="search-btn">搜索</button>
            <button id="reset-btn">重置</button>
        </div>
        <button id="trend-chart-btn">走势图</button>
        <div class="rows-selector">
            <label for="rows-per-page">每页显示: </label>
            <select id="rows-per-page">
                <option value="50" selected>50行</option>
                <option value="100">100行</option>
                <option value="200">200行</option>
                <option value="500">500行</option>
                <option value="all">全部</option>
            </select>
        </div>
    </div>

    <table id="results-table">
        <thead>
        <tr>
            <th>期号</th>
            <th>开奖号码</th>
            <th>特别号</th>
            <th>和值</th>
            <th>跨度</th>
            <th>奇偶比</th>
            <th>区间比</th>
        </tr>
        </thead>
        <tbody id="results-body">
        <!-- 数据将通过JavaScript动态加载 -->
        </tbody>
    </table>

    <div class="pagination" id="pagination">
        <!-- 分页按钮将通过JavaScript动态生成 -->
    </div>

    <button id="back-to-top" class="back-to-top">↑</button>

</main>
<script src="../js/qlc_results.js"></script>
<script src="../js/navigation.js"></script>
</body>
</html>
