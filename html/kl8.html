<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快乐8开奖结果</title>
    <link rel="stylesheet" href="../css/main.css">
    </style>
</head>
<body>
<nav>
    <div class="nav-links">
        <a href="../index.html">首页</a>
        <a href="ssq.html">双色球</a>
        <a href="kl8.html">快乐8</a>
        <a href="#dlt">大乐透</a>
        <a href="#fc3d">福彩3D</a>
        <a href="#qlc">七乐彩</a>
        <a href="#pl3">排列3</a>
    </div>
</nav>

<main>
    <h1>快乐8开奖结果</h1>

    <div class="search-and-rows">
        <div class="search-box">
            <input type="text" id="period-search" placeholder="输入期号查询">
            <button id="search-btn">搜索</button>
            <button id="reset-btn">重置</button>
        </div>
        <button id="trend-chart-btn" onclick="window.location.href='kl8_trend_chart.html'">中奖概率展示</button>
        <div class="form-group">
            <label for="spacer-select">号码间隔:</label>
            <select id="spacer-select" class="form-control">
                <option value="0">不增加间隔</option>
                <option value="2">每2个号码一组</option>
                <option value="4" selected>每4个号码一组</option>
                <option value="5">每5个号码一组</option>
                <option value="10">每10个号码一组</option>
            </select>
            <div class="form-group">
                <label for="show-consecutive">展示连号:</label>
                <input type="checkbox" id="show-consecutive" class="form-control">
            </div>
        </div>
        <div class="rows-selector">
            <label for="rows-per-page">每页显示: </label>
            <select id="rows-per-page">
                <option value="50" selected>50行</option>
                <option value="100">100行</option>
                <option value="200">200行</option>
                <option value="500">500行</option>
                <option value="all">全部</option>
            </select>
        </div>
    </div>

    <table id="results-table">
        <thead>
        <tr>
            <th>期号</th>
            <th>开奖号码</th>
        </tr>
        </thead>
        <tbody id="results-body">
        <!-- 数据将通过JavaScript动态填充 -->
        </tbody>
    </table>

    <div class="pagination" id="pagination">
        <!-- 分页按钮将通过JavaScript动态生成 -->
    </div>
    
    <button id="back-to-top" class="back-to-top">↑</button>

</main>

<script src="../js/kl8_results.js"></script>
</body>
</html>
