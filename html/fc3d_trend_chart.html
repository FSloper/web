<main>
    <div class="prize-table">
        <h2>福彩3D中奖概率与奖金</h2>
        <table>
            <thead>
            <tr>
                <th>中奖等级</th>
                <th>中奖概率</th>
                <th>奖金(元)</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td>一等奖</td>
                <td><span class="prob-decimal">0.001</span> <span class="prob-percent">(0.1%)</span> <span
                        class="prob-fraction">(1/1000)</span></td>
                <td>1040</td>
            </tr>
            <tr>
                <td>二等奖</td>
                <td><span class="prob-decimal">0.01</span> <span class="prob-percent">(1%)</span> <span
                        class="prob-fraction">(1/100)</span></td>
                <td>346</td>
            </tr>
            <tr>
                <td>三等奖</td>
                <td><span class="prob-decimal">0.1</span> <span class="prob-percent">(10%)</span> <span
                        class="prob-fraction">(1/10)</span></td>
                <td>173</td>
            </tr>
            <tr>
                <td>总中奖</td>
                <td><span class="prob-decimal">0.111</span> <span class="prob-percent">(11.1%)</span> <span
                        class="prob-fraction">(1/9)</span></td>
                <td>-</td>
            </tr>
            <tr>
                <td>每注期望</td>
                <td>-0.5</td>
                <td>-</td>
            </tr>
            <tr>
                <td>相对性价比</td>
                <td>-4.5</td>
                <td>-</td>
            </tr>
            </tbody>
        </table>
    </div>
