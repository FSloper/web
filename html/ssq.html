<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双色球开奖结果</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
<nav>
    <div class="nav-links">
        <a href="../index.html"><img src="../img/favicon.ico" class="logo"></a>
        <a href="../index.html">首页</a>
        <a href="ssq.html">双色球</a>
        <a href="kl8.html">快乐8</a>
        <a href="fc3d.html">福彩3D</a>
        <a href="#dlt">大乐透</a>
        <a href="#qlc">七乐彩</a>
        <a href="#pl3">排列3</a>
    </div>
</nav>

<main>
    <h1>双色球开奖结果
        <button id="check-prize-btn" class="prize-btn">查奖</button>
    </h1>

    <div class="search-and-rows">
        <div class="search-box">
            <input type="text" id="period-search" placeholder="输入期号查询">
            <button id="search-btn">搜索</button>
            <button id="reset-btn">重置</button>
        </div>
        <button id="trend-chart-btn" onclick="window.location.href='ssq_trend_chart.html'">中奖概率展示</button>
        <div class="rows-selector">
            <label for="rows-per-page">每页显示: </label>
            <select id="rows-per-page">
                <option value="50" selected>50行</option>
                <option value="100">100行</option>
                <option value="200">200行</option>
                <option value="500">500行</option>
                <option value="all">全部</option>
            </select>
        </div>
    </div>

    <table id="results-table">
        <thead>
        <tr>
            <th>期号</th>
            <th>红球</th>
            <th>蓝球</th>
            <th>和值</th>
            <th>跨度</th>
            <th>区间比</th>
            <th>奇偶比</th>
            <th>质合比</th>
            <th>蓝球跨度</th>
        </tr>
        <tr>
            <th colspan="3">平均值</th>
            <th id="avg-sum">-</th>
            <th id="avg-span">-</th>
            <th id="avg-zone">-</th>
            <th id="avg-odd-even">-</th>
            <th id="avg-prime">-</th>
            <th id="avg-blue-span">-</th>
        </tr>
        </thead>
        <tbody id="results-body">
        <!-- 数据将通过JavaScript动态加载 -->
        </tbody>
    </table>

    <div class="pagination" id="pagination">
        <!-- 分页按钮将通过JavaScript动态生成 -->
    </div>

    <button id="back-to-top" class="back-to-top">↑</button>

</main>

<script src="../js/ssq_results.js"></script>
<script src="../js/ssq_check_prize.js"></script>
</body>
</html>
