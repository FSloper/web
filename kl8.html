<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快乐8开奖结果</title>
    <style>
        /* 导航栏样式 */
        nav {
            background: #2c3e50;
            padding: 1rem;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }
        
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #3498db;
        }

        /* 主体内容 */
        main {
            margin-top: 80px;
            padding: 2rem;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        /* 球样式 */
        .kl8-ball {
            display: inline-block;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            text-align: center;
            line-height: 30px;
            margin-right: 5px;
            font-weight: bold;
            color: white;
            margin-bottom: 5px;
        }
        
        .kl8-ball.group-0 { background-color: #e74c3c; }
        .kl8-ball.group-1 { background-color: #f39c12; }
        .kl8-ball.group-2 { background-color: #2ecc71; }
        .kl8-ball.group-3 { background-color: #9b59b6; }
        .kl8-ball.group-4 { background-color: #1abc9c; }

        /* 表格样式 */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th, td {
            padding: 0.75rem;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #f2f2f2;
        }

        /* 分页控件 */
        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 2rem;
            gap: 0.5rem;
        }

        .pagination button {
            padding: 0.5rem 1rem;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
        }

        .pagination button.active {
            background: #3498db;
            color: white;
            border-color: #3498db;
        }

        /* 行数选择器 */
        .rows-selector {
            margin: 1rem 0;
            text-align: right;
        }

        select {
            padding: 0.5rem;
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-links">
            <a href="index.html">首页</a>
            <a href="ssq.html">双色球</a>
            <a href="kl8.html">快乐8</a>
            <a href="#dlt">大乐透</a>
            <a href="#fc3d">福彩3D</a>
            <a href="#qlc">七乐彩</a>
            <a href="#pl3">排列3</a>
        </div>
    </nav>

    <main>
        <h1>快乐8开奖结果</h1>
        
        <div class="rows-selector">
            <label for="rows-per-page">每页显示: </label>
            <select id="rows-per-page">
                <option value="10">10</option>
                <option value="20">20</option>
                <option value="50">50</option>
                <option value="100">100</option>
                <option value="all">全部</option>
            </select>
        </div>
        
        <table id="results-table">
            <thead>
                <tr>
                    <th>期号</th>
                    <th>开奖号码</th>
                </tr>
            </thead>
            <tbody id="results-body">
                <!-- 数据将通过JavaScript动态填充 -->
            </tbody>
        </table>
        
        <div class="pagination" id="pagination">
            <!-- 分页按钮将通过JavaScript动态生成 -->
        </div>
    </main>

    <script src="js/kl8_results.js"></script>
</body>
</html>
